services:
  postgres:
    image: postgres:16
    container_name: shopit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopit
      POSTGRES_USER: shopit
      POSTGRES_PASSWORD: shopit_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: shopit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
